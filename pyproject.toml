[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netpredict"
version = "1.0.0"
description = "Autonomous ML Network Telemetry & Congestion Prediction System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "sse-starlette>=2.1.0",
    "starlette>=0.38.0",
    "httpx>=0.27.0",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
